<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fog Horn — Monoline Identity</title>
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
		body { font-family: "Avenir Next", Avenir, "Helvetica Neue", sans-serif; }
		main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr); }
		.primary { min-height: 100vh; display: grid; place-items: center; padding: 5vw; border-right: 1px solid #242424; }
		.primary img { width: min(100%, 680px); max-height: 88vh; }
		.aside { display: grid; grid-template-rows: 1fr 1fr; }
		.tile { display: grid; place-items: center; padding: 42px; }
		.tile + .tile { border-top: 1px solid #242424; }
		.tile img { width: min(72%, 260px); }
		.caption { align-content: center; justify-items: start; gap: 12px; }
		.caption p { margin: 0; color: #999; max-width: 31ch; font-size: 14px; line-height: 1.55; }
		.caption strong { color: #fff; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
		@media (max-width: 760px) {
			main { grid-template-columns: 1fr; }
			.primary { min-height: 70vh; border-right: 0; border-bottom: 1px solid #242424; padding: 30px; }
			.aside { grid-template-columns: 1fr 1fr; grid-template-rows: none; }
			.tile + .tile { border-top: 0; border-left: 1px solid #242424; }
		}
	</style>
</head>
<body>
	<main>
		<section class="primary"><img src="fog-horn-logo.svg" alt="Fog Horn monoline logo"></section>
		<aside class="aside">
			<div class="tile"><img src="fog-horn-app-icon.svg" alt="Fog Horn app icon"></div>
			<div class="tile caption">
				<strong>Fog Horn</strong>
				<p>An original loose-line foghorn, drawn in one visual language from bell to pedestal with two clear sound curves.</p>
			</div>
		</aside>
	</main>
</body>
</html>
