# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Point Gradle's JVM at a truststore that includes the corporate TLS-inspection
# root CA ("Flutter Entertainment plc Root CA"). Without this, every download
# from dl.google.com stalls for 5 min per artifact before timing out.
# Built once via keytool: JBR cacerts copy + corp root imported.
systemProp.javax.net.ssl.trustStore=/Users/whitaarc/.gradle/cacerts-with-corp
systemProp.javax.net.ssl.trustStorePassword=changeit

# Build in parallel across sub-projects.
org.gradle.parallel=true

# Reuse task outputs from previous builds when inputs are unchanged.
org.gradle.caching=true

# Cache the configuration phase (Gradle 8.x).
org.gradle.configuration-cache=true

# Only configure projects Gradle actually needs for the current task graph.
org.gradle.configureondemand=true

# Keep the Gradle daemon alive between builds.
org.gradle.daemon=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Not needed — no legacy support libraries in the tree. Skips a slow build step.
android.enableJetifier=false

# Faster R class generation and smaller build outputs.
android.nonTransitiveRClass=true

# Skip BuildConfig generation unless a module actually needs it.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
